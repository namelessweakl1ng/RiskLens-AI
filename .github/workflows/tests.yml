name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check backend training_pipeline tests
      - run: python -m ruff format --check backend training_pipeline tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in frontend/js/*.js; do node --check "$file" || exit 1; done
